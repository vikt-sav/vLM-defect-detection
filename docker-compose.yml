services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # To use a NVIDIA GPU, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      DEFECTBENCH_VLM_MODEL: qwen2.5vl:3b
      DEFECTBENCH_DATA_DIR: /data
      DEFECTBENCH_ARTIFACTS_DIR: /artifacts
    volumes:
      - ./data:/data
      - ./artifacts:/artifacts
    depends_on:
      - ollama

volumes:
  ollama_models:
