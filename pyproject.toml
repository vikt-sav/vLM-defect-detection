[project]
name = "defectbench"
version = "0.1.0"
description = "Three-layer device defect inspection benchmark: classical CV baseline vs VLM (Qwen2.5-VL) vs QLoRA fine-tuned VLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viktor Savostyanov" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
baseline = [
    "torch>=2.6",
    "torchvision>=0.21",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Notebooks use latin/cyrillic comments intentionally and run only in Colab.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
